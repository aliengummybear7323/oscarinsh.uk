<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oscarinsh.uk</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #fafafa;
      color: #1a1a1a;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 480px;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.75rem;
    }
    p {
      color: #666;
      font-size: 1.05rem;
      line-height: 1.5;
      margin: 0 0 2rem;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ea44f;
      margin-right: 8px;
      vertical-align: middle;
    }
    .status {
      font-size: 0.85rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    footer {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.8rem;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>oscarinsh.uk</h1>
    <p>Something's being built here. Check back soon.</p>
    <div class="status"><span class="dot"></span>Site under construction</div>
  </div>
  <footer>&copy; 2026 oscarinsh.uk</footer>
</body>
</html>
