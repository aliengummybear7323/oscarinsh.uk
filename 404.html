<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404: Lost in Space | Oscar Insh</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Baloo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Baloo 2', sans-serif;
    color: #e8eaf6;
    background: radial-gradient(circle at 20% 20%, #2a1a5e 0%, #14103a 45%, #0a0820 100%);
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
    radial-gradient(2px 2px at 20px 30px, white, transparent),
    radial-gradient(2px 2px at 140px 80px, white, transparent),
    radial-gradient(1px 1px at 90px 40px, white, transparent),
    radial-gradient(1px 1px at 200px 150px, white, transparent),
    radial-gradient(2px 2px at 260px 60px, white, transparent),
    radial-gradient(1px 1px at 320px 120px, white, transparent),
    radial-gradient(2px 2px at 380px 20px, white, transparent),
    radial-gradient(1px 1px at 40px 180px, white, transparent);
    background-repeat: repeat;
    background-size: 420px 220px;
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
}

.container {
    position: relative;
    z-index: 1;
    max-width: 600px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    text-align: center;
}

header {
    margin-bottom: 2rem;
}

.error-code {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 6.5rem;
    font-weight: 700;
    margin: 0;
    line-height: 1;
    background: linear-gradient(90deg, #ff79c6, #ae81ff, #8be9fd);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.05em;
    animation: floating 4s ease-in-out infinite;
}

.astronaut {
    font-size: 4.5rem;
    display: inline-block;
    margin: 1rem 0;
    animation: spin-slow 20s linear infinite;
}

h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    margin: 0 0 0.8rem;
    background: linear-gradient(90deg, #a78bfa, #f472b6, #60a5fa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.card {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 2rem;
    margin-bottom: 2rem;
    backdrop-filter: blur(6px);
}

.card p {
    line-height: 1.65;
    margin: 0 0 1.5rem;
    color: #dcdcf5;
    font-size: 1.15rem;
}

.btn-home {
    display: inline-block;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
    color: #0a0820;
    padding: 0.8rem 2rem;
    border-radius: 999px;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
}

.btn-home:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(167, 139, 250, 0.5);
}

.btn-home:active {
    transform: translateY(0);
}

footer {
    color: #7b7fa8;
    font-size: 0.85rem;
    margin-top: 2rem;
}

footer span {
    display: block;
    margin-top: 0.3rem;
}

footer a {
    color: #D97757;
    text-decoration: none;
    font-weight: 600;
}

footer a:hover {
    text-decoration: underline;
}

footer a.opensource {
    color: #40E0D0;
}

@keyframes floating {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
}

@keyframes spin-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="container">
    <header>
        <div class="error-code">404</div>
        <span class="astronaut">🧑‍🚀</span>
        <h1>Lost in the Deep Cosmos</h1>
    </header>

    <div class="card">
        <p>Houston, we have a problem. The webpage you are searching for has drifted entirely out of orbit or never existed in this universe.</p>
        <a href="/" class="btn-home">Return to Earth Base</a>
    </div>

    <footer>
        Made by Oscar, with more than a little help from <a href="https://claude.ai" target="_blank" rel="noopener">Claude</a>.
        <span>This page is <a class="opensource" href="https://github.com/aliengummybear7323/oscarinsh.uk" target="_blank" rel="noopener">Open Source</a>.</span>
        <span>©️ 2026 Oscar Insh</span>
    </footer>
</div>
</body>
</html>
